[package]
name = "fleetchain"
version = "0.1.0"
edition = "2021"

[lib]
name = "fleetchain"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
rand = "0.8"
chrono = "0.4"
bellman = "0.14"
bls12_381 = "0.8"
ff = "0.13"
group = "0.13"
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.11", features = ["json"] }
clap = { version = "4.4", features = ["derive"] }

# Groth16 proving over BLS12-381 is unusably slow without optimisation, and the
# generic prover code is compiled into this crate, so optimise it too.
[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3
